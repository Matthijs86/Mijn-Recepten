<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mijn Recepten</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="app-header">
            <h1>Mijn Recepten</h1>
            <p>Bewaar al je favoriete recepten op één plek</p>
        </header>

        <!-- ==========================
             RECEPT TOEVOEGEN
        =========================== -->

        <section class="formulier">

            <h2>Recept toevoegen</h2>

            <input
                type="text"
                id="naamInput"
                placeholder="Naam van het recept"
                autocomplete="off"
            >

            <input
                type="url"
                id="urlInput"
                placeholder="Plak hier de Instagram, Facebook of website link"
            >

            <select id="categorieInput">
                <option value="">Kies een categorie</option>
                <option value="Pasta">🍝 Pasta</option>
                <option value="Kip">🍗 Kip</option>
                <option value="Vlees">🥩 Vlees</option>
                <option value="Vis">🐟 Vis</option>
                <option value="Slowcook">🥗 Slowcook</option>
                <option value="Fastfood">🍔 Fastfood</option>
                <option value="Ontbijt">🍳 Ontbijt</option>
                <option value="Bakken">🍰 Bakken</option>
                <option value="Overig">🍲 Overig</option>
            </select>

            <textarea
                id="notitieInput"
                placeholder="Eigen notitie (optioneel)"
            ></textarea>

            <label class="favoriet-keuze">
                <input type="checkbox" id="favorietInput">
                <span>⭐ Favoriet</span>
            </label>

            <button id="opslaanKnop">
                + Recept opslaan
            </button>

        </section>


        <!-- ==========================
             ZOEKEN EN FILTEREN
        =========================== -->

        <section class="zoeken">

            <input
                type="search"
                id="zoekInput"
                placeholder="🔎 Zoek een recept..."
                autocomplete="off"
            >

            <select id="filterInput">
                <option value="alle">Alle categorieën</option>
                <option value="Pasta">🍝 Pasta</option>
                <option value="Kip">🍗 Kip</option>
                <option value="Vlees">🥩 Vlees</option>
                <option value="Vis">🐟 Vis</option>
                <option value="Slowcook">🥗 Slowcook</option>
                <option value="Fastfood">🍔 Fastfood</option>
                <option value="Ontbijt">🍳 Ontbijt</option>
                <option value="Bakken">🍰 Bakken</option>
                <option value="Overig">🍲 Overig</option>
            </select>

        </section>


        <!-- ==========================
             RECEPTEN
        =========================== -->

        <section class="recepten">

            <div class="lijst-header">
                <h2>Mijn recepten</h2>

                <span id="aantalRecepten">
                    0 recepten
                </span>
            </div>

            <div id="receptenLijst"></div>

            <div id="legeLijst" class="lege-lijst">
                <div class="lege-icoon">🍴</div>

                <h3>Nog geen recepten</h3>

                <p>
                    Voeg hierboven je eerste recept toe.
                </p>
            </div>

        </section>


        <!-- ==========================
             ALLES WISSEN
        =========================== -->

        <section class="beheer">

            <button id="allesWissenKnop" class="wissen-knop">
                🗑️ Alles wissen
            </button>

        </section>


        <!-- ==========================
             FOOTER
        =========================== -->

        <footer>
            Mijn Recepten
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
