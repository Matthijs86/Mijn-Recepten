<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#c2410c"
    >

    <meta
        name="description"
        content="Mijn persoonlijke receptenboek."
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <title>Mijn Recepten</title>

</head>


<body>

<main class="app">


    <!-- ==================================
         HEADER
    ================================== -->

    <header class="app-header">

        <div class="header-icoon">
            👨‍🍳
        </div>

        <h1>
            Mijn Recepten
        </h1>

        <p>
            Mijn persoonlijke receptenboek
        </p>

    </header>


    <!-- ==================================
         ZOEKEN
    ================================== -->

    <section class="zoek-sectie">

        <label for="zoekInput">
            🔎 Zoek een recept
        </label>

        <input
            type="search"
            id="zoekInput"
            placeholder="Zoek op naam, categorie of notitie..."
            autocomplete="off"
        >

    </section>


    <!-- ==================================
         OVERZICHT
    ================================== -->

    <section class="statistieken">

        <div class="stat-kaart">

            <span>
                🍽️
            </span>

            <strong id="aantalRecepten">
                0
            </strong>

            <small>
                Recepten
            </small>

        </div>


        <div class="stat-kaart">

            <span>
                ❤️
            </span>

            <strong id="aantalFavorieten">
                0
            </strong>

            <small>
                Favorieten
            </small>

        </div>

    </section>


    <!-- ==================================
         CATEGORIEËN
    ================================== -->

    <section class="categorie-sectie">

        <div class="sectie-kop">

            <h2>
                🍳 Categorieën
            </h2>

        </div>


        <div
            id="categorieKnoppen"
            class="categorie-knoppen"
        ></div>


        <button
            id="favorietenKnop"
            class="filter-knop"
            type="button"
        >
            ❤️ Favorieten
        </button>

    </section>


    <!-- ==================================
         RECEPTEN
    ================================== -->

    <section class="recepten-sectie">

        <div class="recepten-kop">

            <h2 id="lijstTitel">
                🍴 Mijn recepten
            </h2>

            <span id="zoekMelding"></span>

        </div>


        <div
            id="receptenLijst"
            class="recepten-lijst"
        ></div>


        <p
            id="legeLijst"
            class="lege-lijst"
        >
            Nog geen recepten toegevoegd.
        </p>

    </section>


    <!-- ==================================
         RECEPT TOEVOEGEN
    ================================== -->

    <section class="formulier">

        <h2>
            👨‍🍳 Recept toevoegen
        </h2>


        <label for="naamInput">
            Naam van het recept
        </label>

        <input
            type="text"
            id="naamInput"
            placeholder="Bijvoorbeeld: Romige kip pasta"
            autocomplete="off"
        >


        <label for="urlInput">
            Link naar het recept
        </label>

        <input
            type="url"
            id="urlInput"
            placeholder="https://..."
            autocomplete="url"
        >


        <label for="categorieInput">
            Categorie
        </label>

        <select id="categorieInput">

            <option value="">
                Kies een categorie
            </option>

        </select>


        <label for="notitieInput">
            Notitie
        </label>

        <textarea
            id="notitieInput"
            rows="4"
            placeholder="Bijvoorbeeld: extra knoflook gebruiken..."
        ></textarea>


        <label class="favoriet-label">

            <input
                type="checkbox"
                id="favorietInput"
            >

            <span>
                ❤️ Toevoegen aan favorieten
            </span>

        </label>


        <button
            id="opslaanKnop"
            class="primaire-knop"
            type="button"
        >
            🍳 Recept opslaan
        </button>

    </section>


    <!-- ==================================
         ALLES WISSEN
    ================================== -->

    <button
        id="allesWissenKnop"
        class="wis-knop"
        type="button"
    >
        🗑️ Alle recepten wissen
    </button>


    <!-- ==================================
         FOOTER
    ================================== -->

    <footer>

        Made by Matthijs Karst Boersma

    </footer>


</main>


<script src="./script.js"></script>


<!-- ==================================
     SERVICE WORKER
================================== -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register("./sw.js")
                .then(
                    registratie => {

                        console.log(
                            "Service Worker actief:",
                            registratie.scope
                        );

                    }
                )
                .catch(
                    fout => {

                        console.error(
                            "Service Worker fout:",
                            fout
                        );

                    }
                );

        }
    );

}

</script>

</body>

</html>
